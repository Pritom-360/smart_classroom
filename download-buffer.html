    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preparing Your Secure Link - Smart Classroom</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }

        body {
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }

        .buffer-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 2rem;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .main-card {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            text-align: center;
        }

        .status-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .timer-circle {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 6px solid #e2e8f0;
            border-top: 6px solid #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 1.5rem;
            position: relative;
            animation: pulse-border 1s infinite;
        }

        @keyframes pulse-border {
            0% { border-color: #e2e8f0; border-top-color: #3b82f6; }
            50% { border-color: #cbd5e1; border-top-color: #2563eb; }
            100% { border-color: #e2e8f0; border-top-color: #3b82f6; }
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 1.5rem 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-gradient);
            width: 0%;
            transition: width 0.5s linear;
        }

        .message-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }

        .message-sub {
            color: #64748b;
            font-size: 0.95rem;
        }

        .action-btn {
            display: none;
            background: var(--primary-gradient);
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            transition: all 0.3s;
            margin-top: 2rem;
            border: none;
            cursor: pointer;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }

        .error-msg {
            color: #ef4444;
            display: none;
            text-align: center;
        }

        @media (max-width: 576px) {
            .buffer-wrapper { padding: 1.5rem 1rem; }
            .main-card { padding: 2rem 1.25rem; }
            .timer-circle { width: 90px; height: 90px; font-size: 1.8rem; }
            .message-title { font-size: 1.25rem; }
        }
    </style>
    <link rel="canonical" href="https://www.catalyst-smart-classroom.me/download-buffer.html">
    <meta name="description" content="Securely download your requested university course materials, lecture notes, and academic PDFs from Smart Classroom. Our platform ensures fast, reliable access to the educational resources you need to succeed in your studies.">
</head>

<body>
    <header id="main-header" style="background: white;">
        <div class="container">
            <a href="index.html" class="logo" style="color: #0f172a;">
                <img src="assets/icon/iconi.png" alt="SCL">
                <span>Smart Classroom</span>
            </a>
        </div>
    </header>

    <div class="buffer-wrapper">
        <div class="main-card">
            <div class="status-content">
                <div class="timer-circle" id="timer-val">3</div>
                <div class="message-title" id="main-title">Preparing your materials...</div>
                <div class="message-sub" id="sub-title">Securing your direct link to Google Drive.</div>
                
                <div class="progress-bar-container">
                    <div class="progress-fill" id="progress-bar"></div>
                </div>

                <a href="#" id="access-btn" class="action-btn" target="_blank" rel="noopener noreferrer">
                    <i class="fas fa-download" style="margin-right: 0.5rem;"></i> Download File
                </a>
                <p id="error-box" class="error-msg">Error: Missing file source. Please go back and try again.</p>
            </div>
        </div>
    </div>

    <footer style="background: white; padding: 2rem 0; border-top: 1px solid #e2e8f0; width: 100%;">
        <div class="container">
            <div class="footer-bottom" style="text-align: center;">
                <p>&copy; 2024 Smart Classroom by Arup Bhowmik Pritom. All Rights Reserved.</p>
                <div class="footer-links" style="margin-top: 1rem; display: flex; gap: 1.5rem; justify-content: center;">
                    <a href="index.html">Home</a>
                    <a href="privacy.html">Privacy Policy</a>
                    <a href="about.html">About Us</a>
                    <a href="contact.html">Contact Us</a>
                </div>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const targetUrl = urlParams.get('url');
            
            const timerEl = document.getElementById('timer-val');
            const progressEl = document.getElementById('progress-bar');
            const accessBtn = document.getElementById('access-btn');
            const errorBox = document.getElementById('error-box');
            const mainTitle = document.getElementById('main-title');
            const subTitle = document.getElementById('sub-title');

            if (!targetUrl) {
                document.querySelector('.timer-circle').style.display = 'none';
                mainTitle.style.display = 'none';
                subTitle.style.display = 'none';
                document.querySelector('.progress-bar-container').style.display = 'none';
                errorBox.style.display = 'block';
                return;
            }

            const totalTime = 3;
            let timeLeft = totalTime;

            const updateTimer = () => {
                timerEl.textContent = timeLeft;
                const progress = ((totalTime - timeLeft) / totalTime) * 100;
                progressEl.style.width = progress + '%';

                if (timeLeft <= 0) {
                    clearInterval(countInterval);
                    timerEl.innerHTML = '<i class="fas fa-check" style="color: #10b981;"></i>';
                    mainTitle.textContent = "Link Ready!";
                    subTitle.textContent = "Click the button below to download your materials.";
                    accessBtn.style.display = 'inline-block';
                    accessBtn.href = decodeURIComponent(targetUrl);
                }
                timeLeft--;
            };

            updateTimer();
            const countInterval = setInterval(updateTimer, 1000);
        });
    </script>
</body>

</html>
